name: sait-woocommerce-release-test

services:
  database:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - release_database:/var/lib/mysql
    networks:
      - release_test

  wordpress:
    image: wordpress:6-php7.4-apache
    depends_on:
      database:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DEBUG: 1
    ports:
      - "8890:80"
    volumes:
      - release_wordpress:/var/www/html
    networks:
      - release_test

  wpcli:
    image: wordpress:cli-php7.4
    entrypoint: ["wp"]
    user: "33:33"
    working_dir: /var/www/html
    depends_on:
      database:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      HOME: /tmp
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - release_wordpress:/var/www/html
      - ../..:/workspace:ro
    networks:
      - release_test

volumes:
  release_database:
    name: sait_woocommerce_release_database
  release_wordpress:
    name: sait_woocommerce_release_wordpress

networks:
  release_test:
    name: sait_woocommerce_release_test
    ipam:
      config:
        - subnet: 192.168.65.0/24
